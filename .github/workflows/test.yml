name: tests

on: [push, pull_request]

jobs:
  simulate:
    runs-on: ubuntu-latest
    # make test-full took 625 s on a busy Apple M2 (results/test_full.log).
    # The testbench watchdog catches a hung FSM; this limit catches anything else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Icarus Verilog and the Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python3 -m pip install -r requirements.txt
      # make mutants is not run here. CI is kept to the one bit-exact check, and
      # the planted-bug scripts (sed edits, a parallel runner) have only been run
      # on macOS, never with Ubuntu's GNU sed. Run it locally (results/mutants.log).
      - name: All 4,000 decisions, bit-exact against the golden model
        run: make golden && make test-full
